name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            emacs: "31.1"
          - os: macos-latest
            emacs: "31.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: ${{ matrix.emacs }}
      - uses: actions/checkout@v7
        with:
          repository: P233/emmet2-mode
          ref: 42d305a229aa2d8e2f8ac4a3c425f01e773e829d
          path: .dependencies/emmet2-mode
      - name: Check editor and first package installation
        env:
          SCSS2_EMMET2_DIR: ${{ github.workspace }}/.dependencies/emmet2-mode
        run: make check
      - name: Build release package
        run: make package
